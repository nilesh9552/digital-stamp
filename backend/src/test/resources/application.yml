spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:digital_stamp_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha256-algorithms-ok
    access-expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  cors:
    origins: http://localhost:5173
  upload-dir: target/test-uploads
  seed: false
