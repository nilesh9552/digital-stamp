server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  ssl:
    enabled: true
    key-store: file:C:/Users/Nilesh/Desktop/digital-stamp/certs/digital-stamp.p12
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: 1

spring:
  application:
    name: digital-stamp

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/digital_stamp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Nilu@2004}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:your-development-secret-key}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://192.168.1.201:5173,http://localhost:3000}

  upload-dir: ${APP_UPLOAD_DIR:uploads}
  seed: ${APP_SEED:true}

logging:
  level:
    com.digitalstamp: INFO
    org.springframework.security: WARN